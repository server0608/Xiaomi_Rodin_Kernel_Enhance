name: build-kernel

# rodin 内核构建 + 自动发布 Release（参考 ABK build.yml 的核心编译流程裁剪）：
#   clang-r596125 -> gki_defconfig -> Image + Image.lz4 (LZ4 legacy)
#   -> AnyKernel3 可刷包（内核 blob 命名为 Image，内容为 lz4 legacy 格式，
#      设备启动时只认名为 Image 的 blob）
#   + 与内核树 drivers/kernelsu 落地版本一致的 ReSukiSU 管理器
#     （取 ReSukiSU/ReSukiSU main 分支 Build Manager CI 产物：release + spoofed）
#
# 触发方式（三选一，均会走一遍 gate 去重）：
#   - workflow_dispatch：手动触发（可勾选 force 强制重建）
#   - workflow_run：sync-android15-6.6-lts / sync-resukisu 成功后的链式触发
#   - schedule：每日 03:15 UTC+8 兜底（同步工作流未触发构建时补一次）
# gate 会读取最新 Release body 中的 `rodin-build-sha` 标记：若分支 tip 已经
# 构建并发布过，则跳过本次编译（全量 ThinLTO 约 35-45 分钟，避免重复出包）。

on:
  workflow_dispatch:
    inputs:
      force:
        description: "Force a build even if this branch tip was already built and released"
        type: boolean
        default: false
  schedule:
    - cron: '15 19 * * *'   # daily 03:15 UTC+8, runs after sync workflows
  workflow_run:
    workflows: ["sync-android15-6.6-lts", "sync-resukisu"]
    types:
      - completed

permissions:
  contents: write
  actions: read

# Never let two builds race for the same branch; a queued run re-checks the gate
# and usually skips immediately.
concurrency:
  group: build-kernel-${{ github.event.repository.default_branch }}
  cancel-in-progress: false

env:
  KERNEL_BRANCH: bsp-rodin-v-oss-bp
  CLANG_VER: clang-r596125
  # clang-r596125 预编译目录所在的 googlesource 分支（注意不是
  # mirror-goog-llvm-r596125-release，那是 LLVM 源码镜像，没有预编译产物）
  CLANG_BRANCH: mirror-goog-main-llvm-toolchain-source
  RSU_REPO: Baka-SU/BakaSU

jobs:
  # Cheap pre-flight: the build below takes ~45 min on a 4-core runner, and the
  # three triggers (2x sync chaining + nightly schedule) can all fire for the same
  # commit. Skip the build when the branch tip is already built and released.
  gate:
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    outputs:
      should_build: ${{ steps.decide.outputs.should_build }}
      tip_sha: ${{ steps.decide.outputs.tip_sha }}
    steps:
      - name: Checkout kernel branch tip
        uses: actions/checkout@v4
        with:
          ref: ${{ env.KERNEL_BRANCH }}
          fetch-depth: 1

      - name: Decide whether a build is needed
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE: ${{ github.event.inputs.force }}
        run: |
          set -euo pipefail
          TIP_SHA=$(git rev-parse HEAD)
          echo "tip_sha=$TIP_SHA" >> "$GITHUB_OUTPUT"
          echo "trigger: ${{ github.event_name }}, branch tip: $TIP_SHA"

          if [ "${FORCE:-}" = "true" ]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            echo "::notice::force=true - building regardless of previous releases"
            exit 0
          fi

          LAST_TAG=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 1 \
                       --json tagName --jq '.[0].tagName // empty' || true)
          LAST_SHA=""
          if [ -n "$LAST_TAG" ]; then
            # The release body carries a machine-readable marker of the built commit.
            BODY=$(gh release view "$LAST_TAG" --repo "$GITHUB_REPOSITORY" \
                     --json body --jq '.body // ""' || true)
            LAST_SHA=$(printf '%s\n' "$BODY" \
                       | grep -o 'rodin-build-sha: [0-9a-f]\{7,40\}' \
                       | head -n1 | awk '{print $2}' || true)
          fi
          echo "latest release: ${LAST_TAG:-<none>} (built commit: ${LAST_SHA:-<unknown>})"

          if [ -n "$LAST_SHA" ] && [ "$LAST_SHA" = "$TIP_SHA" ]; then
            echo "should_build=false" >> "$GITHUB_OUTPUT"
            echo "tip $TIP_SHA is already released as $LAST_TAG - no build needed"
          else
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            echo "tip $TIP_SHA differs from last released commit ${LAST_SHA:-<none>} - building"
          fi

  build:
    needs: gate
    if: needs.gate.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.KERNEL_BRANCH }}
          fetch-depth: 1

      - name: Record built commit
        id: built
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Validate BakaSU/SUSFS helper interface
        run: |
          python3 .github/scripts/ksu_susfs_compat.py
          git diff --exit-code -- drivers/kernelsu/feature/selinux_hide.c

      - name: Free disk space
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /usr/local/share/boost || true
          df -h /

      - name: Install build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends flex bison bc libelf-dev libssl-dev dwarves lz4 zip unzip

      - name: Download clang-r596125
        run: |
          set -euo pipefail
          CLANG_DIR="$RUNNER_TEMP/clang"
          mkdir -p "$CLANG_DIR"
          # 1) 分支直链（+archive） 2) 固定 commit 直链 3) 稀疏克隆兜底
          URLS=(
            "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/${CLANG_BRANCH}/${CLANG_VER}.tar.gz"
            "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/8b6826407e25a197d7cf7ceacab0bf67c11173de/${CLANG_VER}.tar.gz"
          )
          ok=""
          for url in "${URLS[@]}"; do
            echo "trying $url"
            rm -rf "$CLANG_DIR"; mkdir -p "$CLANG_DIR"
            if curl -fL --retry 3 --connect-timeout 30 --max-time 1200 "$url" -o "$RUNNER_TEMP/clang.tgz" \
               && tar -xzf "$RUNNER_TEMP/clang.tgz" -C "$CLANG_DIR"; then
              if [ -x "$CLANG_DIR/bin/clang" ]; then
                ok=yes
              elif [ -x "$CLANG_DIR/$CLANG_VER/bin/clang" ]; then
                mv "$CLANG_DIR/$CLANG_VER"/* "$CLANG_DIR"/ && ok=yes
              fi
              [ -n "$ok" ] && break
            fi
            echo "::warning::download/extract failed: $url"
          done
          if [ -z "$ok" ]; then
            echo "::warning::archive endpoints failed, falling back to sparse git clone"
            rm -rf "$CLANG_DIR"; mkdir -p "$CLANG_DIR"
            git clone --depth=1 --filter=blob:none --sparse -b "$CLANG_BRANCH" \
              https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 \
              "$RUNNER_TEMP/clang-src"
            git -C "$RUNNER_TEMP/clang-src" sparse-checkout set "$CLANG_VER"
            mv "$RUNNER_TEMP/clang-src/$CLANG_VER"/* "$CLANG_DIR"/
          fi
          test -x "$CLANG_DIR/bin/clang" || { echo "::error::clang binary not found after download"; ls -la "$CLANG_DIR"; exit 1; }
          echo "$CLANG_DIR/bin" >> "$GITHUB_PATH"
          "$CLANG_DIR/bin/clang" --version

      - name: Build kernel (gki_defconfig -> Image + Image.lz4)
        env:
          KBUILD_BUILD_USER: "403Forbidden"
          KBUILD_BUILD_HOST: "github"
        run: |
          set -euo pipefail
          # BUILD-GUIDE.md：只能用 gki_defconfig 生成用于编译的 .config
          make ARCH=arm64 LLVM=1 gki_defconfig
          JOBS="$(nproc)"
          echo "building with ${JOBS} jobs"
          make ARCH=arm64 LLVM=1 -j"$JOBS" Image Image.lz4
          # 校验 LZ4 legacy 魔数 0x184C2102（BUILD-GUIDE.md 要求）；不是 legacy 就用 lz4 -l 重压
          MAGIC=$(od -An -tx1 -N4 arch/arm64/boot/Image.lz4 | tr -d ' \n')
          if [ "$MAGIC" != "02214c18" ]; then
            echo "::warning::Image.lz4 magic $MAGIC is not lz4 legacy - recompressing with 'lz4 -l'"
            lz4 -f -l -9 arch/arm64/boot/Image arch/arm64/boot/Image.lz4
            MAGIC=$(od -An -tx1 -N4 arch/arm64/boot/Image.lz4 | tr -d ' \n')
            [ "$MAGIC" = "02214c18" ] || { echo "::error::Image.lz4 still not lz4 legacy (magic: $MAGIC)"; exit 1; }
          fi
          KERNEL_RELEASE=$(cat include/config/kernel.release)
          echo "KERNEL_RELEASE=$KERNEL_RELEASE" >> "$GITHUB_ENV"

      - name: Prepare AnyKernel3 flashable tree
        run: |
          set -euo pipefail
          git clone --depth=1 -b gki-2.0 https://github.com/WildKernels/AnyKernel3.git
          rm -rf AnyKernel3/.git
          # 设备启动只认名为 Image 的 blob；内容为 lz4 legacy 压缩的内核
          cp arch/arm64/boot/Image.lz4 AnyKernel3/Image
          sed -i "s|^kernel.string=.*|kernel.string=Rodin ${KERNEL_RELEASE} (ReSukiSU)|" AnyKernel3/anykernel.sh
          # 不再打包外层 zip：artifact 下载下来本身就是可刷的 AK3 zip

      - name: Fetch matching ReSukiSU manager APKs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # sync-resukisu 落地时固定在 drivers/kernelsu/Kbuild 里的 ReSukiSU commit
          RSU_SHA=$(grep -E '^KSU_COMMIT_SHA[[:space:]]*:= *[0-9a-f]{8}[[:space:]]*$' drivers/kernelsu/Kbuild | head -n1 | awk '{print $3}')
          RSU_COUNT=$(awk '$1 == "KSU_LOCAL_VERSION" && $2 == ":=" && $3 ~ /^[0-9]+$/ {print $3}' drivers/kernelsu/Kbuild)
          [ -n "$RSU_SHA" ] && [ -n "$RSU_COUNT" ] || { echo "::error::missing pinned BakaSU version"; exit 1; }
          RSU_VERSION=$((30000 + RSU_COUNT + 700))
          RSU_FULL_SHA=$(gh api "repos/$RSU_REPO/commits/$RSU_SHA" --jq '.sha')
          echo "landed BakaSU commit: $RSU_FULL_SHA (manager version $RSU_VERSION)"

          fetch_apks() { # $1 = BakaSU CI run id, matching the pinned commit
            rm -rf manager manager-spoofed manager-apk
            mkdir -p manager manager-spoofed manager-apk/standard manager-apk/spoofed

            local artifacts art_rel art_spf apk
            local -a apks=()
            artifacts=$(gh api "repos/$RSU_REPO/actions/runs/$1/artifacts?per_page=100") || return 1
            art_rel=$(printf '%s' "$artifacts" | python3 -c 'import json,sys; print(next((str(a["id"]) for a in json.load(sys.stdin)["artifacts"] if a["name"] == "Manager-release" and not a["expired"]), ""))') || return 1
            [ -n "$art_rel" ] || return 1
            gh api "repos/$RSU_REPO/actions/artifacts/$art_rel/zip" > Manager-release.zip || return 1
            unzip -oq Manager-release.zip -d manager-apk/standard || return 1
            mapfile -t apks < <(find manager-apk/standard -type f -name "*_${RSU_VERSION}-arm64-v8a-release.apk")
            [ "${#apks[@]}" -eq 1 ] || { echo "::error::expected one arm64 manager at version $RSU_VERSION"; return 1; }
            cp "${apks[0]}" manager/ || return 1

            # Recent upstream builds publish only the standard manager.
            # Include the spoofed variant only if the same CI run provides it.
            art_spf=$(printf '%s' "$artifacts" | python3 -c 'import json,sys; print(next((str(a["id"]) for a in json.load(sys.stdin)["artifacts"] if a["name"] == "Spoofed-Manager-release" and not a["expired"]), ""))') || return 1
            HAS_SPOOFED_MANAGER=false
            if [ -n "$art_spf" ]; then
              gh api "repos/$RSU_REPO/actions/artifacts/$art_spf/zip" > Spoofed-Manager-release.zip || return 1
              unzip -oq Spoofed-Manager-release.zip -d manager-apk/spoofed || return 1
              mapfile -t apks < <(find manager-apk/spoofed -type f -name "*_${RSU_VERSION}-arm64-v8a*release.apk")
              [ "${#apks[@]}" -eq 1 ] || return 1
              apk=$(basename "${apks[0]}")
              if [[ "$apk" != *spoofed* ]]; then
                apk="${apk%-release.apk}-spoofed-release.apk"
              fi
              cp "${apks[0]}" "manager-spoofed/$apk" || return 1
              HAS_SPOOFED_MANAGER=true
            else
              echo "::notice::matching upstream run has no spoofed manager; publishing standard manager only"
            fi
          }

          RUN_ID=""
          for cand in $(gh api "repos/$RSU_REPO/actions/workflows/build-manager.yml/runs?branch=main&head_sha=$RSU_FULL_SHA&status=success&per_page=100" \
                        --jq ".workflow_runs[] | select(.head_sha == \"$RSU_FULL_SHA\") | .id"); do
            echo "trying run $cand (matches pinned BakaSU commit)"
            if fetch_apks "$cand"; then
              RUN_ID="$cand"
              break
            fi
          done
          [ -n "$RUN_ID" ] || { echo "::error::no usable manager artifacts for pinned commit $RSU_FULL_SHA; refusing a mismatched fallback"; exit 1; }
          {
            echo "RSU_RUN_URL=https://github.com/$RSU_REPO/actions/runs/$RUN_ID"
            echo "HAS_SPOOFED_MANAGER=$HAS_SPOOFED_MANAGER"
            echo "RSU_MANAGER_VERSION=$RSU_VERSION"
          } >> "$GITHUB_ENV"
          ls -la manager manager-spoofed

      - name: Upload AnyKernel3 flashable zip
        uses: actions/upload-artifact@v4
        with:
          # artifact 根目录即 AK3 包内容（anykernel.sh / Image / META-INF/...），
          # 下载得到的 zip 无需再解包即可刷入
          name: Rodin-${{ env.KERNEL_RELEASE }}-AnyKernel3
          path: AnyKernel3/**
          if-no-files-found: error

      - name: Upload ReSukiSU manager APK (release, arm64-v8a)
        uses: actions/upload-artifact@v4
        with:
          name: rodin-${{ env.KERNEL_RELEASE }}-manager
          path: manager/*.apk
          if-no-files-found: error

      - name: Upload ReSukiSU manager APK (spoofed, arm64-v8a)
        if: env.HAS_SPOOFED_MANAGER == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: rodin-${{ env.KERNEL_RELEASE }}-manager-spoofed
          path: manager-spoofed/*.apk
          if-no-files-found: error

      - name: Build summary
        run: |
          {
            echo "### Rodin kernel build"
            echo "- kernel: \`${KERNEL_RELEASE}\` (Image.lz4 = lz4 legacy, magic 02214c18 verified)"
            echo "- AK3 flashable zip: artifact \`Rodin-${KERNEL_RELEASE}-AnyKernel3\` (downloaded zip is directly flashable, kernel blob Image = lz4 legacy)"
            echo "- BakaSU manager (arm64-v8a): version ${RSU_MANAGER_VERSION}, from the pinned commit's [CI run]($RSU_RUN_URL); spoofed variant included: ${HAS_SPOOFED_MANAGER}"
            echo "- BakaSU/SUSFS compatibility: shared 8-argument helper interface; preinit runner disabled. Boot, manager recognition and installed modules passed the owner's Rodin test. Hiding effectiveness and long-term stability are not established by the build."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Package artifacts for Release
        id: release_prep
        run: |
          set -euo pipefail
          mkdir -p release-assets
          # AnyKernel3 -> a single flashable zip (entries stored without a leading ./)
          AK3_ZIP="Rodin-${KERNEL_RELEASE}-AnyKernel3.zip"
          (cd AnyKernel3 && find . -mindepth 1 -maxdepth 1 -printf '%P\0' \
             | xargs -0 zip -r9 "../release-assets/${AK3_ZIP}")
          # Exact-commit standard manager, plus spoofed variant if provided upstream.
          cp -f manager/*.apk release-assets/
          if [ "$HAS_SPOOFED_MANAGER" = true ]; then
            cp -f manager-spoofed/*.apk release-assets/
          fi
          ls -la release-assets/
          # kernel.release can carry characters that are invalid in a git tag
          SAFE_RELEASE=$(printf '%s' "$KERNEL_RELEASE" | tr -c 'A-Za-z0-9._-' '-')
          {
            echo "RELEASE_TAG=v${SAFE_RELEASE}-$(date -u +'%Y%m%d-%H%M')"
            echo "AK3_ZIP=${AK3_ZIP}"
          } >> "$GITHUB_ENV"

      - name: Create GitHub Release (tagged with timestamp)
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          # tag the exact commit that was compiled
          target_commitish: ${{ steps.built.outputs.sha }}
          name: "小米 Rodin 增强内核 | Kernel Enhance ${{ env.KERNEL_RELEASE }}"
          draft: false
          prerelease: false
          make_latest: true
          files: release-assets/*
          body: |
            ## 📱 小米 / 红米 Rodin 增强内核 (Xiaomi Rodin Kernel Enhance)
            > **特性集成 / Features**: BakaSU (原 ReSukiSU) Root + SuSFS + BBG + scheduler backports + BBRv3 & FQ

            <!-- rodin-build-sha: ${{ steps.built.outputs.sha }} -->

            ### 本次兼容修复与验证范围 (Compatibility & Validation)

            - 统一 BakaSU 与内核侧 SuSFS 的 SELinux 辅助函数声明、可见性和 8 参数调用，修复最终链接失败；保持 preinit runner 禁用。
              Shared SELinux helper declarations and matching 8-argument calls fix the link failure; the preinit runner remains disabled.
            - 用户已在 Rodin 测试包上确认正常开机、管理器识别及已安装模块运行正常；这不代表 SuSFS 隐藏效果或长期稳定性已经验证。
              Owner-tested on Rodin: boot, manager recognition and installed modules. Hiding effectiveness and long-term stability remain unverified.
            - 配套管理器 Version Code：`${{ env.RSU_MANAGER_VERSION }}`，只取内核固定提交的官方产物；伪装版仅在同次上游构建提供时附带（本次：`${{ env.HAS_SPOOFED_MANAGER }}`）。
              Manager artifacts must match the pinned kernel component commit; the spoofed variant is optional.

            ### 📦 文件下载与使用说明 (Download & Usage)

            | 文件名 (File) | 说明与刷入方式 (Description & Instructions) |
            |---|---|
            | **`${{ env.AK3_ZIP }}`** | **【内核刷机包】AnyKernel3 Flashable Zip**<br>• **中文**：直接在 KernelSU / APatch / TWRP 中刷入，**无需解压**！内核已内置 LZ4 Legacy（魔数 `02214c18`）压缩验证，刷完直接重启设备即可生效。<br>• **English**: Flash directly via KernelSU / APatch / TWRP **without unpacking**. Pre-built with verified LZ4 Legacy compression. Reboot after flashing. |
            | **`*release.apk` (不带 spoofed)** | **【官方管理器·标准版】ReSukiSU Manager (Standard)**<br>• **中文**：标准版 Root 管理器 APP，适合日常使用。<br>• **English**: Official standard Root manager application. |
            | **`*spoofed-release.apk`（如有 / if available）** | **【管理器·伪装版】BakaSU Manager (Spoofed)**<br>上游提供时才附带，不承诺绕过应用检测。Included only when provided by the same upstream CI run; detection bypass is not guaranteed. |

            > 💡 **安装提示 (Note)**：管理器与内核内置驱动版本严格对应。标准版与伪装版**二选一安装即可**，请勿同时安装两个管理器。<br>
            > *Install EITHER the standard OR the spoofed manager APK (do not install both).*

            ---

            ### 📋 构建详细信息 (Build Details)

            - **内核版本 (Kernel Release)**: `${{ env.KERNEL_RELEASE }}`
            - **编译基线提交 (Commit)**: `${{ steps.built.outputs.sha }}` (分支 `${{ env.KERNEL_BRANCH }}`)
            - **触发来源 (Trigger)**: `${{ github.event_name }}`
            - **管理器来源 (Manager Source)**: [上游 ReSukiSU 官方构建任务 (Upstream CI Run)](${{ env.RSU_RUN_URL }})
